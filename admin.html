<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='robots' content='noindex,nofollow'><title>VoruVoru Backoffice</title>
<style>body{font-family:Arial;background:#fff7fb;color:#4a3550;margin:0}.w{max-width:900px;margin:auto;padding:24px}.c{background:white;padding:20px;border-radius:16px;margin:14px 0;border:1px solid #ead8e3}input,textarea{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #d9c4d2;border-radius:8px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:999px;font-weight:700;cursor:pointer}.p{background:#ff6b9d;color:white}.s{background:#f5e8f0;color:#e8457a}.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #ead8e3;padding:12px;border-radius:12px;margin:10px 0}.thumb{width:110px;height:110px;object-fit:cover;border-radius:10px}</style></head>
<body><div class='w'>
<div id='login' class='c'><h1>VoruVoru Backoffice</h1><input id='u' value='admin'><input id='pw' type='password' value='123'><button class='p' onclick='doLogin()'>Login</button><p id='lm'></p></div>
<div id='app' class='hide'>
<h1>VoruVoru Backoffice</h1>
<div class='c'><h2>Site</h2><label>Hero title</label><input id='heroTitle'><label>Hero subtitle</label><textarea id='heroSubtitle'></textarea><label>Email</label><input id='email'></div>
<div class='c'><h2>Harga</h2><label>Headshot USD</label><input id='ph' type='number'><label>Half Body USD</label><input id='pm' type='number'><label>Full Body USD</label><input id='pf' type='number'></div>
<div class='c'><div class='row'><h2 style='flex:1'>Gallery</h2><button class='s' onclick='addG()'>+ Foto</button></div><div id='gl'></div></div>
<div class='c'><button class='p' onclick='publish()'>Save & Publish</button><p id='st'>Ready.</p></div>
</div></div>
<script>
const API='https://voruvoru-cms-api.onlineadmin00.workers.dev'; let data;
const H=()=>({'authorization':'Bearer '+sessionStorage.getItem('vvtoken')});
async function doLogin(){let r=await fetch(API+'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:pw.value})});if(!r.ok){lm.textContent='Login gagal';return}let j=await r.json();sessionStorage.setItem('vvtoken',j.token);login.classList.add('hide');app.classList.remove('hide');load()}
async function load(){st.textContent='Loading...';let r=await fetch(API+'/cms',{headers:H()});data=await r.json();let s=data.site||{};heroTitle.value=(s.heroTitleLine1||'')+' '+(s.heroTitleAccent||'');heroSubtitle.value=s.heroSubtitle||'';email.value=s.contactEmail||'';let pr=data.pricing||[];ph.value=(pr.find(x=>x.key==='headshot')||{}).price??30;pm.value=(pr.find(x=>x.key==='halfbody')||{}).price??50;pf.value=(pr.find(x=>x.key==='fullbody')||{}).price??70;renderG();st.textContent='Loaded'}
function renderG(){gl.innerHTML='';(data.gallery||[]).forEach((g,i)=>{gl.insertAdjacentHTML('beforeend',`<div class="item"><input value="${g.caption||''}" oninput="data.gallery[${i}].caption=this.value"><input value="${g.image||''}" oninput="data.gallery[${i}].image=this.value"><input id="f${i}" type="file" accept="image/*"><div class="row"><button class="s" onclick="up(${i})">Upload gambar</button><button onclick="data.gallery.splice(${i},1);renderG()">Hapus</button></div></div>`)})}
function addG(){data.gallery=data.gallery||[];data.gallery.push({caption:'New artwork',image:''});renderG()}
async function up(i){let f=document.getElementById('f'+i).files[0];if(!f)return alert('Pilih gambar');let fd=new FormData();fd.append('file',f);st.textContent='Uploading...';let r=await fetch(API+'/upload',{method:'POST',headers:H(),body:fd});let j=await r.json();if(!r.ok){st.textContent='Upload gagal';return}data.gallery[i].image=j.path;renderG();st.textContent='Uploaded'}
async function publish(){
data.site=data.site||{};
data.site.heroSubtitle=heroSubtitle.value;
data.site.contactEmail=email.value;
data.pricing=data.pricing||[];
function setPrice(key,val){let x=data.pricing.find(i=>i.key===key);if(x)x.price=Number(val)}
setPrice('headshot',ph.value);setPrice('halfbody',pm.value);setPrice('fullbody',pf.value);
st.textContent='Publishing...';
let r=await fetch(API+'/cms',{method:'PUT',headers:{...H(),'content-type':'application/json'},body:JSON.stringify(data)});
st.textContent=r.ok?'Published. Tunggu GitHub Pages update.':'Publish gagal'
}
</script></body></html>
